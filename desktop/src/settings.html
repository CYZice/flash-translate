<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'"
    >
    <title>Flash Translate · 设置</title>
    <link rel="stylesheet" href="settings.css">
    <script src="settings-ui.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <img src="assets/icon.png" width="24" height="24" alt="">
        <h1>翻译设置</h1>
      </header>
      <form id="settings-form">
        <fieldset id="fields" disabled>
          <div class="field">
            <label for="base-url">API 地址</label>
            <input
              id="base-url"
              name="baseUrl"
              type="url"
              placeholder="https://api.example.com/v1"
              required
              autocomplete="off"
              spellcheck="false"
            >
          </div>
          <div class="field">
            <label for="model">模型</label>
            <input
              id="model"
              name="model"
              placeholder="模型名称"
              required
              autocomplete="off"
              spellcheck="false"
            >
          </div>
          <div class="field">
            <label for="api-key">API 密钥</label>
            <input
              id="api-key"
              name="apiKey"
              type="text"
              placeholder="无密钥可留空"
              autocomplete="off"
              spellcheck="false"
            >
            <label class="check" id="clear-key-row" hidden
              ><input id="clear-key" type="checkbox">清除密钥</label
            >
          </div>
          <label class="toggle"
            ><input id="auto-zh-en" type="checkbox">自动中英互译</label
          >
          <div class="language-row" id="manual-languages">
            <div class="field">
              <label for="source-language">原文</label
              ><select id="source-language">
                <option value="auto">自动识别</option>
                <option value="Chinese">中文</option>
                <option value="English">英语</option>
                <option value="Japanese">日语</option>
                <option value="Korean">韩语</option>
                <option value="French">法语</option>
                <option value="German">德语</option>
                <option value="Spanish">西班牙语</option>
              </select>
            </div>
            <div class="field">
              <label for="target-language">译文</label
              ><select id="target-language">
                <option value="Chinese">简体中文</option>
                <option value="Traditional Chinese">繁體中文</option>
                <option value="English">英语</option>
                <option value="Japanese">日语</option>
                <option value="Korean">韩语</option>
                <option value="French">法语</option>
                <option value="German">德语</option>
                <option value="Spanish">西班牙语</option>
              </select>
            </div>
          </div>
          <div class="font-row">
            <label for="font-size">字号</label>
            <input
              id="font-size"
              type="range"
              min="14"
              max="24"
              step="1"
              value="18"
            ><output id="font-size-value" for="font-size">18</output>
          </div>
          <div class="actions">
            <button id="test" class="secondary" type="button">测试连接</button
            ><button id="save" class="primary" type="submit">保存</button>
          </div>
        </fieldset>
      </form>
      <p id="status" role="status" aria-live="polite" hidden></p>
    </main>
  </body>
</html>
