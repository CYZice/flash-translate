<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { margin: 0; background: transparent; }
      .card { min-height: 180px; padding: 16px; border: 1px solid rgba(255,255,255,.14); border-radius: 16px; background: rgba(28,28,32,.98); color: #f5f5f7; box-shadow: 0 12px 32px rgba(0,0,0,.32); }
      .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
      .title { color: #aaaab5; font-size: 12px; letter-spacing: .02em; }
      .actions { display: flex; gap: 2px; }
      button { width: 28px; height: 28px; border: 0; border-radius: 8px; color: #b9b9c4; background: transparent; cursor: pointer; }
      button:hover { color: #fff; background: rgba(255,255,255,.12); }
      button.active { color: #8ab4ff; background: rgba(138,180,255,.14); }
      svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      #result { white-space: pre-wrap; line-height: 1.58; font-size: 15px; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="header">
        <div class="title">Flash Translate</div>
        <div class="actions">
          <button id="pin" title="Pin window" aria-label="Pin window">
            <svg viewBox="0 0 24 24"><path d="m15 4 5 5-3 1-3 4 1 3-2 2-3-4-4-3 2-2 3 1 4-3 1-3Z"/><path d="m12 14-7 7"/></svg>
          </button>
          <button id="copy" title="Copy translation" aria-label="Copy translation">
            <svg viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
          </button>
          <button id="close" title="Close" aria-label="Close">
            <svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>
          </button>
        </div>
      </div>
      <div id="result">Waiting for translation…</div>
    </main>
    <script>
      window.selectionDesktop.onSelectionResult((text) => {
        document.getElementById("result").textContent = text;
      });
      document.getElementById("pin").onclick = async () => {
        const pinned = await window.selectionDesktop.toggleResultPin();
        document.getElementById("pin").classList.toggle("active", pinned);
      };
      document.getElementById("copy").onclick = () => window.selectionDesktop.copyResult();
      document.getElementById("close").onclick = () => window.selectionDesktop.hideResult();
      window.selectionDesktop.onResultPinState((pinned) => {
        document.getElementById("pin").classList.toggle("active", pinned);
      });
    </script>
  </body>
</html>
