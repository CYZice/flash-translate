<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'"
    >
    <title>翻译</title>
    <link rel="stylesheet" href="result.css">
    <script src="result-ui.js" defer></script>
  </head>
  <body>
    <main class="card">
      <header>
        <div class="direction">
          <span id="source" title="自动识别">AUTO</span
          ><svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="m9 5 7 7-7 7" />
          </svg><span id="target" title="简体中文">ZH</span>
        </div>
        <div class="header-actions">
          <button
            id="auto"
            type="button"
            title="划词后自动翻译"
            aria-label="划词后自动翻译"
            aria-pressed="false"
          >
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="m13 2-9 12h7l-1 8 10-12h-7l1-8Z" />
            </svg>
          </button>
          <button
            id="pin"
            type="button"
            title="钉住"
            aria-label="钉住翻译卡片"
            aria-pressed="false"
          >
            <!-- Same Lucide Pin / PinOff paths as the browser extension. -->
            <svg aria-hidden="true" data-icon="pin" viewBox="0 0 24 24">
              <path d="M12 17v5" />
              <path
                d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"
              />
            </svg>
            <svg
              aria-hidden="true"
              data-icon="pin-off"
              viewBox="0 0 24 24"
              hidden
            >
              <path d="M12 17v5" />
              <path d="M15 9.34V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H7.89" />
              <path d="m2 2 20 20" />
              <path
                d="M9 9v1.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h11"
              />
            </svg>
          </button>
          <button id="close" type="button" title="关闭" aria-label="关闭">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="m6 6 12 12M6 18 18 6" />
            </svg>
          </button>
        </div>
      </header>
      <section class="content">
        <div
          id="loading"
          class="loading"
          role="status"
          aria-label="正在翻译"
          hidden
        >
          <svg aria-hidden="true" viewBox="0 0 32 20">
            <path
              class="loading-track"
              d="M16 10C12 4 10 3 7 3C3.7 3 2 6 2 10s1.7 7 5 7c3 0 5-1 9-7s6-7 9-7c3.3 0 5 3 5 7s-1.7 7-5 7c-3 0-5-1-9-7Z"
            />
            <path
              class="loading-flow"
              pathLength="100"
              d="M16 10C12 4 10 3 7 3C3.7 3 2 6 2 10s1.7 7 5 7c3 0 5-1 9-7s6-7 9-7c3.3 0 5 3 5 7s-1.7 7-5 7c-3 0-5-1-9-7Z"
            />
          </svg>
        </div>
        <div id="result" role="status" aria-live="polite"></div>
      </section>
      <footer>
        <span id="notice" role="status" aria-live="polite"></span>
        <button
          id="copy"
          type="button"
          title="复制"
          aria-label="复制译文"
          disabled
        >
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <rect x="8" y="8" width="12" height="12" rx="2" />
            <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3" />
          </svg>
        </button>
        <button id="retry" type="button" title="重试" aria-label="重新翻译">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M3 11a9 9 0 1 1 2.6 7M3 4v7h7" />
          </svg>
        </button>
      </footer>
      <div id="resize-handle" aria-hidden="true">
        <svg viewBox="0 0 16 16">
          <title>调整大小</title>
          <path d="m5 14 9-9M9 14l5-5" />
        </svg>
      </div>
    </main>
  </body>
</html>
