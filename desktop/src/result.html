<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { margin: 0; background: transparent; }
      .card { min-height: 180px; padding: 18px; border: 1px solid rgba(255,255,255,.18); border-radius: 16px; background: rgba(28,28,32,.98); color: #f5f5f7; box-shadow: 0 12px 32px rgba(0,0,0,.35); }
      .title { margin-bottom: 12px; color: #aaaab5; font-size: 12px; }
      #result { white-space: pre-wrap; line-height: 1.55; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="title">Flash Translate</div>
      <div id="result">Waiting for translation…</div>
    </main>
    <script>
      window.selectionDesktop.onSelectionResult((text) => {
        document.getElementById("result").textContent = text;
      });
    </script>
  </body>
</html>
