<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { margin: 0; background: transparent; overflow: hidden; }
      .card { position: relative; box-sizing: border-box; height: 100%; min-height: 190px; padding: 26px 22px 48px; border: 1px solid rgba(255,255,255,.13); border-radius: 20px; background: rgba(27,27,31,.97); color: #f5f5f7; box-shadow: 0 16px 42px rgba(0,0,0,.34); overflow: hidden; -webkit-app-region: drag; }
      .accent { position: absolute; left: 22px; top: 18px; width: 7px; height: 7px; border-radius: 50%; background: #8ab4ff; box-shadow: 0 0 0 4px rgba(138,180,255,.14); }
      .content { height: 100%; overflow: auto; padding: 8px 2px 4px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.2) transparent; -webkit-app-region: no-drag; }
      #result { white-space: pre-wrap; line-height: 1.62; font-size: 15px; color: #f5f5f7; }
      .hint { color: #9696a3; }
      button { position: absolute; width: 34px; height: 34px; border: 0; border-radius: 11px; color: #a9a9b6; background: rgba(255,255,255,.055); cursor: pointer; -webkit-app-region: no-drag; }
      button:hover { color: #fff; background: rgba(255,255,255,.13); }
      button.active { color: #8ab4ff; background: rgba(138,180,255,.16); }
      #pin { top: 14px; right: 14px; }
      #copy { right: 14px; bottom: 14px; }
      svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="accent" aria-hidden="true"></span>
      <button id="pin" title="Keep window open" aria-label="Keep window open">
        <svg viewBox="0 0 24 24"><path d="m15 4 5 5-3 1-3 4 1 3-2 2-3-4-4-3 2-2 3 1 4-3 1-3Z"/><path d="m12 14-7 7"/></svg>
      </button>
      <section class="content"><div id="result" class="hint">Translating…</div></section>
      <button id="copy" title="Copy translation" aria-label="Copy translation">
        <svg viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
      </button>
    </main>
    <script>
      window.selectionDesktop.onSelectionResult((text) => {
        const result = document.getElementById("result");
        result.textContent = text;
        result.classList.toggle("hint", text === "Translating…");
      });
      document.getElementById("pin").onclick = async () => {
        const pinned = await window.selectionDesktop.toggleResultPin();
        const button = document.getElementById("pin");
        button.classList.toggle("active", pinned);
        button.title = pinned ? "Unpin window" : "Keep window open";
        button.setAttribute("aria-label", button.title);
      };
      document.getElementById("copy").onclick = () => window.selectionDesktop.copyResult();
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") window.selectionDesktop.hideResult();
      });
      window.selectionDesktop.onResultPinState((pinned) => {
        const button = document.getElementById("pin");
        button.classList.toggle("active", pinned);
        button.title = pinned ? "Unpin window" : "Keep window open";
        button.setAttribute("aria-label", button.title);
      });
    </script>
  </body>
</html>
