<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { margin: 0; background: transparent; }
      .toolbar {
        display: flex; gap: 3px; padding: 4px;
        border: 1px solid rgba(255,255,255,.13); border-radius: 16px;
        background: rgba(27,27,31,.97); box-shadow: 0 10px 26px rgba(0,0,0,.3);
      }
      button { width: 36px; height: 36px; border: 0; border-radius: 12px; color: #f5f5f7; background: transparent; cursor: pointer; }
      button:hover { background: rgba(255,255,255,.12); }
      button:active { background: rgba(255,255,255,.18); }
      svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <button id="translate" title="Translate" aria-label="Translate">
        <svg viewBox="0 0 24 24"><path d="M4 5h8M8 3v2m-2 0a8 8 0 0 0 5 7m-1-7a8 8 0 0 1-5 7m7 0h8m-4-3 4 9m0 0-1.3-3.2h-5.4L7 21m4.3-5.2h5.4"/></svg>
      </button>
      <button id="copy" title="Copy selected text" aria-label="Copy selected text">
        <svg viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
      </button>
    </div>
    <script>
      document.getElementById("translate").onclick = () => window.selectionDesktop.translate();
      document.getElementById("copy").onclick = () => window.selectionDesktop.copy();
      window.selectionDesktop.onSelectionChanged(() => {});
    </script>
  </body>
</html>
